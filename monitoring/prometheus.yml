global:
  scrape_interval: 15s       # How often Prometheus scrapes metrics
  evaluation_interval: 15s   # How often rules are evaluated

scrape_configs:

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Spring Boot backend via /actuator/prometheus
  - job_name: 'product-catalog-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'product-catalog-backend'
