# ══════════════════════════════════════════════════════════════════════════════
#  Microservices CI/CD Pipeline
#  Services: product-service, user-service, order-service, frontend
#  Stages: build → test → docker → trivy → push-ecr → deploy-eks → verify
# ══════════════════════════════════════════════════════════════════════════════

name: Microservices CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'user-service/**'
      - 'order-service/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'user-service/**'
      - 'order-service/**'
      - 'frontend/**'
      - 'k8s/**'

# ── Global environment variables ──────────────────────────────────────────────
env:
  AWS_REGION:              ap-south-1
  AWS_ACCOUNT_ID:          003399066686
  ECR_REGISTRY:            003399066686.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPO:            java-eks-backend
  FRONTEND_REPO:           java-eks-frontend
  USER_SERVICE_REPO:       java-eks-user-service
  ORDER_SERVICE_REPO:      java-eks-order-service
  EKS_CLUSTER_NAME:        java-eks-cluster
  K8S_NAMESPACE:           product-catalog

jobs:

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 1 — BUILD & TEST ALL SERVICES
# ══════════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── Build product-service ───────────────────────────────────────────────
      - name: Build product-service
        run: |
          chmod +x backend/gradlew
          cd backend && ./gradlew clean build -x test --no-daemon
          echo "✅ product-service built"

      - name: Test product-service
        run: |
          cd backend && ./gradlew test --no-daemon
          echo "✅ product-service tests passed"

      # ── Build user-service ──────────────────────────────────────────────────
      - name: Build user-service
        run: |
          chmod +x user-service/gradlew
          cd user-service && ./gradlew clean build -x test --no-daemon
          echo "✅ user-service built"

      - name: Test user-service
        run: |
          cd user-service && ./gradlew test --no-daemon
          echo "✅ user-service tests passed"

      # ── Build order-service ─────────────────────────────────────────────────
      - name: Build order-service
        run: |
          chmod +x order-service/gradlew
          cd order-service && ./gradlew clean build -x test --no-daemon
          echo "✅ order-service built"

      - name: Test order-service
        run: |
          cd order-service && ./gradlew test --no-daemon
          echo "✅ order-service tests passed"

      # ── Upload JAR artifacts ────────────────────────────────────────────────
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars-${{ github.run_number }}
          path: |
            backend/build/libs/*.jar
            user-service/build/libs/*.jar
            order-service/build/libs/*.jar
          retention-days: 1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            backend/build/reports/tests/
            user-service/build/reports/tests/
            order-service/build/reports/tests/
          retention-days: 7

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 2 — DOCKER BUILD + TRIVY SCAN + PUSH TO ECR
# ══════════════════════════════════════════════════════════════════════════════
  docker-build-scan-push:
    name: Docker Build → Trivy Scan → Push ECR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars-${{ github.run_number }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── Docker Build all services ───────────────────────────────────────────
      - name: Build product-service image
        run: |
          docker build --no-cache \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:build-${{ github.run_number }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest \
            ./backend
          echo "✅ product-service image built"

      - name: Build user-service image
        run: |
          docker build --no-cache \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.USER_SERVICE_REPO }}:build-${{ github.run_number }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.USER_SERVICE_REPO }}:latest \
            ./user-service
          echo "✅ user-service image built"

      - name: Build order-service image
        run: |
          docker build --no-cache \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ORDER_SERVICE_REPO }}:build-${{ github.run_number }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ORDER_SERVICE_REPO }}:latest \
            ./order-service
          echo "✅ order-service image built"

      - name: Build frontend image
        run: |
          docker build --no-cache \
            --build-arg VITE_API_URL="" \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:build-${{ github.run_number }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest \
            ./frontend
          echo "✅ frontend image built"

      # ── Trivy Scan all images ───────────────────────────────────────────────
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y && sudo apt-get install -y trivy

      - name: Trivy scan — all images
        run: |
          for SERVICE in product-service user-service order-service frontend; do
            case $SERVICE in
              product-service) IMAGE=${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:build-${{ github.run_number }} ;;
              user-service)    IMAGE=${{ env.ECR_REGISTRY }}/${{ env.USER_SERVICE_REPO }}:build-${{ github.run_number }} ;;
              order-service)   IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ORDER_SERVICE_REPO }}:build-${{ github.run_number }} ;;
              frontend)        IMAGE=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:build-${{ github.run_number }} ;;
            esac
            echo "🔍 Scanning $SERVICE..."
            trivy image --severity CRITICAL,HIGH --no-progress --format table \
              --output trivy-${SERVICE}-report.txt $IMAGE || true
          done
        continue-on-error: true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports-${{ github.run_number }}
          path: trivy-*.txt
          retention-days: 30

      # ── Push all images to ECR ──────────────────────────────────────────────
      - name: Push all images to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:build-${{ github.run_number }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.USER_SERVICE_REPO }}:build-${{ github.run_number }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.USER_SERVICE_REPO }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ORDER_SERVICE_REPO }}:build-${{ github.run_number }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ORDER_SERVICE_REPO }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:build-${{ github.run_number }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
          echo "✅ All images pushed — build-${{ github.run_number }}"

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 3 — DEPLOY TO EKS
# ══════════════════════════════════════════════════════════════════════════════
  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker-build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
          kubectl get nodes

      - name: Deploy all services to EKS
        run: |
          echo "🚀 Deploying build-${{ github.run_number }} to EKS..."

          # Apply namespace and configmap
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

          # Deploy all services with build number
          sed "s|IMAGE_TAG|build-${{ github.run_number }}|g" k8s/backend-deployment.yaml | kubectl apply -f -
          sed "s|IMAGE_TAG|build-${{ github.run_number }}|g" k8s/frontend-deployment.yaml | kubectl apply -f -
          sed "s|IMAGE_TAG|build-${{ github.run_number }}|g" k8s/user-deployment.yaml | kubectl apply -f -
          sed "s|IMAGE_TAG|build-${{ github.run_number }}|g" k8s/order-deployment.yaml | kubectl apply -f -

          # Apply ingress and HPA
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

          echo "✅ All manifests applied"

      - name: Wait for all rollouts
        run: |
          for DEPLOY in backend frontend user-service order-service; do
            echo "⏳ Waiting for $DEPLOY..."
            kubectl rollout status deployment/$DEPLOY \
              -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          done
          echo "✅ All rollouts complete"

      - name: Verify deployment
        run: |
          echo "════════════════════════════════════════"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc  -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}
          ALB_URL=$(kubectl get ingress product-catalog-ingress \
            -n ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "provisioning...")
          echo "Application URL → http://${ALB_URL}"
          echo "════════════════════════════════════════"
