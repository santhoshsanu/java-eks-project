apiVersion: v1
kind: ConfigMap
metadata:
  name: product-catalog-config
  namespace: product-catalog
data:
  # Common config for all services
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_H2_CONSOLE_ENABLED: "false"   # disable H2 console in production

  # Frontend config
  VITE_API_URL: ""   # empty = frontend calls /api/* (nginx proxies to backend)

  # NOTE: SERVER_PORT is NOT set here — each service sets its own port
  # backend      → 8080 (set in application.properties)
  # user-service → 8081 (set in application.properties)
  # order-service→ 8082 (set in application.properties)
