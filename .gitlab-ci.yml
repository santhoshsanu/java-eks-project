# ══════════════════════════════════════════════════════════════════════════════
#  Product Catalog — GitLab CI/CD Pipeline
#  Stages: build → test → docker → trivy → push → deploy → verify
# ══════════════════════════════════════════════════════════════════════════════

# ── Global Variables ──────────────────────────────────────────────────────────
variables:
  AWS_REGION:          "ap-south-1"
  AWS_ACCOUNT_ID:      "889951088124"
  ECR_REGISTRY:        "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
  BACKEND_REPO:        "java-eks-backend"
  FRONTEND_REPO:       "java-eks-frontend"
  EKS_CLUSTER_NAME:    "java-eks-cluster"
  K8S_NAMESPACE:       "product-catalog"

  # Image tags — CI_PIPELINE_IID is GitLab's auto-increment build number
  BACKEND_IMAGE:       "${ECR_REGISTRY}/${BACKEND_REPO}:build-${CI_PIPELINE_IID}"
  FRONTEND_IMAGE:      "${ECR_REGISTRY}/${FRONTEND_REPO}:build-${CI_PIPELINE_IID}"

  # Trivy — fail on CRITICAL and HIGH vulnerabilities
  TRIVY_SEVERITY:      "CRITICAL,HIGH"

  # Docker — disable TLS for local Docker socket on runner
  DOCKER_HOST:         "unix:///var/run/docker.sock"
  DOCKER_DRIVER:       "overlay2"

# ── Pipeline Stages ───────────────────────────────────────────────────────────
stages:
  - build
  - test
  - docker-build
  - trivy-scan
  - push
  - deploy
  - verify

# ── Default settings applied to all jobs ─────────────────────────────────────
default:
  # Use the Jenkins EC2 as GitLab Runner (shell executor)
  tags:
    - eks-runner
  # Retry once on runner system failures
  retry:
    max: 1
    when: runner_system_failure

# ══════════════════════════════════════════════════════════════════════════════
#  STAGE 1 — BUILD BACKEND
# ══════════════════════════════════════════════════════════════════════════════
build-backend:
  stage: build
  script:
    - echo "========== STAGE 1 - BUILD BACKEND (GRADLE) =========="
    - echo "Pipeline  Build Number  → build-${CI_PIPELINE_IID}"
    - echo "Commit SHA              → ${CI_COMMIT_SHORT_SHA}"
    - echo "Branch                  → ${CI_COMMIT_BRANCH}"
    - cd backend
    - chmod +x gradlew
    - ./gradlew clean build -x test --no-daemon
    - echo "Backend JAR built successfully"
    - ls -lh build/libs/
  artifacts:
    name: "backend-jar-${CI_PIPELINE_IID}"
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 hour
  only:
    - main
    - merge_requests

# ══════════════════════════════════════════════════════════════════════════════
#  STAGE 2 — UNIT TESTS
# ══════════════════════════════════════════════════════════════════════════════
unit-tests:
  stage: test
  script:
    - echo "========== STAGE 2 - UNIT TESTS =========="
    - cd backend
    - chmod +x gradlew
    - ./gradlew test --no-daemon
    - echo "Unit tests completed"
  artifacts:
    name: "test-results-${CI_PIPELINE_IID}"
    when: always          # publish even on failure so we can see what failed
    reports:
      junit: backend/build/test-results/**/*.xml
    paths:
      - backend/build/reports/tests/
    expire_in: 7 days
  dependencies:
    - build-backend
  only:
    - main
    - merge_requests

# ══════════════════════════════════════════════════════════════════════════════
#  STAGE 3 — DOCKER BUILD
# ══════════════════════════════════════════════════════════════════════════════
docker-build:
  stage: docker-build
  script:
    - echo "========== STAGE 3 - DOCKER BUILD =========="
    - echo "Building backend  → ${BACKEND_IMAGE}"
    - echo "Building frontend → ${FRONTEND_IMAGE}"

    # Build backend image
    - |
      docker build \
        --no-cache \
        --tag ${BACKEND_IMAGE} \
        --tag ${ECR_REGISTRY}/${BACKEND_REPO}:latest \
        ./backend

    # Build frontend image
    - |
      docker build \
        --no-cache \
        --build-arg VITE_API_URL="" \
        --tag ${FRONTEND_IMAGE} \
        --tag ${ECR_REGISTRY}/${FRONTEND_REPO}:latest \
        ./frontend

    - echo "Docker images built successfully"
    - docker images | grep -E "${BACKEND_REPO}|${FRONTEND_REPO}"
  dependencies:
    - build-backend
  only:
    - main

# ══════════════════════════════════════════════════════════════════════════════
#  STAGE 4 — TRIVY SECURITY SCAN
# ══════════════════════════════════════════════════════════════════════════════
trivy-scan:
  stage: trivy-scan
  script:
    - echo "========== STAGE 4 - TRIVY SECURITY SCAN =========="

    # Scan backend image — report saved as artifact
    - echo "--- Scanning backend image ---"
    - |
      trivy image \
        --severity ${TRIVY_SEVERITY} \
        --no-progress \
        --format table \
        --output trivy-backend-report.txt \
        ${BACKEND_IMAGE}
    - cat trivy-backend-report.txt

    # Scan frontend image
    - echo "--- Scanning frontend image ---"
    - |
      trivy image \
        --severity ${TRIVY_SEVERITY} \
        --no-progress \
        --format table \
        --output trivy-frontend-report.txt \
        ${FRONTEND_IMAGE}
    - cat trivy-frontend-report.txt

    - echo "Trivy scan completed"

  artifacts:
    name: "trivy-reports-${CI_PIPELINE_IID}"
    when: always
    paths:
      - trivy-backend-report.txt
      - trivy-frontend-report.txt
    expire_in: 30 days
  dependencies:
    - docker-build
  # Allow pipeline to continue even if vulnerabilities found
  # Change allow_failure to false to block pipeline on CRITICAL vulns
  allow_failure: true
  only:
    - main

# ══════════════════════════════════════════════════════════════════════════════
#  STAGE 5 — PUSH TO ECR
# ══════════════════════════════════════════════════════════════════════════════
push-to-ecr:
  stage: push
  script:
    - echo "========== STAGE 5 - PUSH TO ECR =========="

    # Authenticate Docker to ECR using EC2 instance role (no keys needed)
    - |
      aws ecr get-login-password \
        --region ${AWS_REGION} | \
      docker login \
        --username AWS \
        --password-stdin ${ECR_REGISTRY}

    # Push backend — build-number tag + latest tag
    - echo "Pushing → ${BACKEND_IMAGE}"
    - docker push ${BACKEND_IMAGE}
    - docker push ${ECR_REGISTRY}/${BACKEND_REPO}:latest

    # Push frontend — build-number tag + latest tag
    - echo "Pushing → ${FRONTEND_IMAGE}"
    - docker push ${FRONTEND_IMAGE}
    - docker push ${ECR_REGISTRY}/${FRONTEND_REPO}:latest

    - echo "All images pushed to ECR successfully"
  dependencies:
    - docker-build
    - trivy-scan
  only:
    - main

# ══════════════════════════════════════════════════════════════════════════════
#  STAGE 6 — DEPLOY TO EKS
# ══════════════════════════════════════════════════════════════════════════════
deploy-to-eks:
  stage: deploy
  script:
    - echo "========== STAGE 6 - DEPLOY TO EKS =========="
    - echo "Deploying build-${CI_PIPELINE_IID} → cluster: ${EKS_CLUSTER_NAME}"

    # Configure kubectl to connect to EKS
    - |
      aws eks update-kubeconfig \
        --region ${AWS_REGION} \
        --name ${EKS_CLUSTER_NAME}

    # Verify cluster connection
    - kubectl get nodes

    # Apply namespace and configmap
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/configmap.yaml

    # Replace IMAGE_TAG placeholder with actual build number then apply
    - |
      sed "s|IMAGE_TAG|build-${CI_PIPELINE_IID}|g" k8s/backend-deployment.yaml | \
      kubectl apply -f -

    - |
      sed "s|IMAGE_TAG|build-${CI_PIPELINE_IID}|g" k8s/frontend-deployment.yaml | \
      kubectl apply -f -

    # Apply ingress and HPA
    - kubectl apply -f k8s/ingress.yaml
    - kubectl apply -f k8s/hpa.yaml

    - echo "Manifests applied — waiting for rollout..."

    # Wait for rollout to complete (max 3 minutes each)
    - |
      kubectl rollout status deployment/backend \
        -n ${K8S_NAMESPACE} \
        --timeout=180s

    - |
      kubectl rollout status deployment/frontend \
        -n ${K8S_NAMESPACE} \
        --timeout=180s

    - echo "Deployment successful — build-${CI_PIPELINE_IID} is live"

  environment:
    name: production
    url: http://$CI_ENVIRONMENT_URL
  dependencies:
    - push-to-ecr
  only:
    - main

# ══════════════════════════════════════════════════════════════════════════════
#  STAGE 7 — VERIFY
# ══════════════════════════════════════════════════════════════════════════════
verify:
  stage: verify
  script:
    - echo "========== STAGE 7 - VERIFY DEPLOYMENT =========="

    # Show running pods
    - echo "--- Pods ---"
    - kubectl get pods -n ${K8S_NAMESPACE} -o wide

    # Show services
    - echo "--- Services ---"
    - kubectl get svc -n ${K8S_NAMESPACE}

    # Show HPA status
    - echo "--- HPA ---"
    - kubectl get hpa -n ${K8S_NAMESPACE}

    # Get ALB URL
    - echo "--- Application URL (ALB) ---"
    - |
      ALB_URL=$(kubectl get ingress product-catalog-ingress \
        -n ${K8S_NAMESPACE} \
        -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending...")
      echo "Application is accessible at → http://${ALB_URL}"

  dependencies:
    - deploy-to-eks
  only:
    - main

# ══════════════════════════════════════════════════════════════════════════════
#  CLEANUP — runs after every pipeline regardless of success/failure
# ══════════════════════════════════════════════════════════════════════════════
cleanup:
  stage: .post        # GitLab built-in post stage — always runs last
  script:
    - echo "========== CLEANUP =========="
    - docker rmi ${BACKEND_IMAGE}  || true
    - docker rmi ${FRONTEND_IMAGE} || true
    - docker rmi ${ECR_REGISTRY}/${BACKEND_REPO}:latest  || true
    - docker rmi ${ECR_REGISTRY}/${FRONTEND_REPO}:latest || true
    - echo "Docker images cleaned from runner"
  when: always
  only:
    - main
